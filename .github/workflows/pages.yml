# Builds frontend/ and publishes it to GitHub Pages.
# Needs repo variable API_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://drought-relief-api.onrender.com, and Settings -> Pages -> Source: GitHub Actions.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp dist/index.html dist/404.html   # single-page app fallback
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
